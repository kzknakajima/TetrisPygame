{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="mb-4">本を編集</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">タイトル <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="title" required
               value="{{ request.form.get('title', book.title) }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">著者 <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="author" required
               value="{{ request.form.get('author', book.author) }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">ジャンル</label>
        <input type="text" class="form-control" name="genre" placeholder="例：小説、ビジネス、技術書..."
               value="{{ request.form.get('genre', book.genre or '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">読書状態</label>
        <select class="form-select" name="status">
          {% set cur_status = request.form.get('status', book.status) %}
          <option value="unread" {% if cur_status == 'unread' %}selected{% endif %}>未読</option>
          <option value="reading" {% if cur_status == 'reading' %}selected{% endif %}>読書中</option>
          <option value="read" {% if cur_status == 'read' %}selected{% endif %}>読了</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">評価</label>
        <select class="form-select" name="rating">
          {% set cur_rating = request.form.get('rating', book.rating | string if book.rating else '') %}
          <option value="">未評価</option>
          <option value="1" {% if cur_rating == '1' %}selected{% endif %}>★☆☆☆☆ (1)</option>
          <option value="2" {% if cur_rating == '2' %}selected{% endif %}>★★☆☆☆ (2)</option>
          <option value="3" {% if cur_rating == '3' %}selected{% endif %}>★★★☆☆ (3)</option>
          <option value="4" {% if cur_rating == '4' %}selected{% endif %}>★★★★☆ (4)</option>
          <option value="5" {% if cur_rating == '5' %}selected{% endif %}>★★★★★ (5)</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">メモ・感想</label>
        <textarea class="form-control" name="memo" rows="4"
                  placeholder="感想や気になった点など...">{{ request.form.get('memo', book.memo or '') }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">更新する</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">キャンセル</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
